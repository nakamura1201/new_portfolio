version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    networks:
      - appnet

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - php
    networks:
      - appnet

networks:
  appnet:
